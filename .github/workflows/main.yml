# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events
on: [push, pull_request]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  run-tox:
    name: run-tox
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under , so your job can access it
      - uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Tox
        run: pip install tox
      - name: Upgrade setuptools
        run: pip install -U setuptools
      - name: Run Tox
        run: tox

  build-package:
    # The package must be buildable when we merge it
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pypa/build
        run: >-
          python3 -m
          pip install
          build
          --user
      - name: Build a binary wheel and a source tarball
        run: python3 -m build

  verify-lock:
    # Ensure requirements.lock stays consistent with pyproject.toml.
    name: Verify dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - name: Verify the lock installs on all supported Python versions
        run: make lock-verify
      - name: Verify all direct dependencies are pinned in the lock
        run: |
          python3 - <<'EOF'
          import re, sys, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          def norm(name): return name.strip().lower().replace("_", "-")
          direct = {norm(re.split(r"[<>=!~;\[ ]", d, 1)[0]) for d in deps}
          locked = {norm(n) for n in re.findall(r"(?m)^([A-Za-z0-9._-]+)==", open("requirements.lock").read())}
          missing = sorted(direct - locked)
          if missing:
              sys.exit(f"Direct dependencies missing from requirements.lock: {missing}\nRun 'make lock' and commit the result.")
          print("All direct dependencies are present in requirements.lock.")
          EOF
